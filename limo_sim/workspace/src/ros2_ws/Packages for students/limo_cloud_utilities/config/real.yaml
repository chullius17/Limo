# Optional local CLOUD-ONLY tuning copied from the previous real CV cloud stage.
# Inputs must already be classified/aligned/cropped upstream. No detector runs.
limo_cloud_utilities:
  ros__parameters:
    # Reconstruct rays for the lower-half 320x120 input grid supplied upstream.
    input_crop_y_min: 0.5
    # Inclusive maximum optical depth, metres (generic default: 2.5 m).
    pointcloud_max_depth_m: 1.3
    sampling:
      # Preserve the original pipeline's exclusion of input IDs greater than 3.
      # The standalone example otherwise preserves extra classes by default.
      passthrough_extra_classes: false
    boardwalk:
      # Minimum seed distance from boundary road, metres (plugin default: 0.15 m).
      blue_radius_min_m: 0.07
    class_filter:
      # Retain only road 1/5 and boardwalk 4/6 (plugin default: false).
      road_boardwalk_only: true
