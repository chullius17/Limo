# Match cv_package's DaBai/Jetson depth profile. Calibration still uses original
# source measurements; reduction applies only to RGB registration afterwards.
limo_depth:
  ros__parameters:
    register_to_rgb: true
    registration_reduce_input: true
    max_processing_rate_hz: 15.0
    input_crop_y_min: 0.5
    calibration_frames: 10
    use_sim_time: false
