# ROS 2 parameter file for map_save_gui / map_save_gui.launch.py.
# Commented entries show the actual C++ defaults. To customize this file, remove
# '{}' from ros__parameters and uncomment the desired entries, as in limo_cloud.
# Parameters are read at startup. Relative names follow the node namespace;
# names starting with '/' are absolute. This GUI can run on a separate desktop.
limo_map_save_gui:
  ros__parameters: {}
    # Trigger service called asynchronously by SAVE MAP. The button is disabled
    # until the reply, then shows its success/error message. A missing service is
    # reported immediately. This must match the mapper's output_prefix followed
    # by '/map_saver/save_map'; it saves files on the machine running the mapper.
    # save_service: /limo/map_package/offline/map_saver/save_map

    # String status stream shown in the window's timestamped log. Subscription
    # QoS is reliable/transient-local, so the latest backend status is replayed
    # when the window connects. Match output_prefix + '/map_saver/status'.
    # status_topic: /limo/map_package/offline/map_saver/status

    # Standard ROS clock selection; GUI polling and shutdown use a Qt wall timer
    # and remain responsive even when simulated /clock is paused. Launch files
    # supply use_sim_time: the standalone GUI defaults to false; the complete
    # mapping example follows its profile (sim=true, real=false).
    # use_sim_time: false
