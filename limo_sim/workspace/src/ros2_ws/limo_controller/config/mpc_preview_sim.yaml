mpc_preview:
  ros__parameters:
    use_sim_time: true
    debug_topic: /limo/control/mpc_debug
    global_path_topic: /limo/planning/path
    tube_radius: 0.60  # Meters from the global path to the white boundary; 0 hides it.
    # control.launch.py overrides this with path_distance_layer.tube_radius.
    tube_line_width: 2  # Pixels; draw the contour without covering the costmap.
    goal_circle_radius: 0.20  # Standalone fallback; launch shares path_executor.goal_circle_radius.
    costmap_topic: /local_costmap/costmap_raw
    footprint_topic: /local_costmap/published_footprint
    view_mode: costmap  # Same final grid used by MPC, including Gaussian inflation.
    laser_topic: /scan
    semantic_points_topic: /limo/map_package/online/local_ctrl_map/points
    fixed_frame: odom
    laser_max_range: 0.0  # All finite returns inside the sensor's declared range.
    source_stale_timeout: 1.0
    base_frame: base_link
    image_topic: /limo/control/mpc_preview/image/compressed
    publish_rate: 10.0
    stale_timeout: 1.0
    costmap_stale_timeout: 2.0
    image_format: png  # png or jpeg
    png_compression: 1
    jpeg_quality: 85
    image_width: 960
    image_height: 960
    pixels_per_meter: 140.0
    grid_spacing: 0.5
    font_size: 17
    costmap_as_points: false  # Draw every final costmap cell with its actual cost.
    costmap_colormap: jet  # 0..253 Jet; 254 lethal is black; 255 unknown is gray.
    costmap_point_size: 3
    costmap_point_color: [35, 40, 50]
    laser_color: [210, 50, 40]
    semantic_color: [30, 100, 210]
    source_cost_colors: true
    source_class_costs: [0, 0, 60, 30, 90, 0, 90]  # Indexed by PointCloud2.class_id.
    source_laser_cost: 100  # Source cost scale 0..100; lethal laser points are black.
    line_width: 2
    selected_line_width: 5
    trajectory_alpha: 0.65
    show_rejected: true  # Dashed: collision/critic rejection.
    show_cost_pruned: false  # Dashed: effort cost already exceeds incumbent.
    axis_length: 0.45
    colors:
      braking: [220, 75, 65]
      nominal: [35, 105, 220]
      constant_curvature: [145, 75, 190]
      perturbed_nominal: [25, 165, 170]
      broad_exploration: [220, 140, 35]
      structured: [230, 60, 180]
      monophase: [70, 185, 195]
      startup: [120, 90, 220]
    selected_color: [0, 180, 65]
    global_path_color: [190, 40, 140]
    free_color: [238, 241, 245]
    inflated_color: [245, 185, 105]
    critical_color: [245, 100, 45]
    lethal_color: [0, 0, 0]
    unknown_color: [110, 115, 125]
    background_color: [250, 250, 250]
