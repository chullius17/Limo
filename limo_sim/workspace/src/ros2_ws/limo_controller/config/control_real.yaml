# real controller profile; selected by robot_model.
# Nav2 Foxy sampled MPC for the AgileX LIMO in Ackermann mode.
# Uses DWB critics to score constrained, time-varying control sequences.
# Steering dynamics and odometry/model agreement need calibration on the robot.

controller_server:
  ros__parameters:
    use_sim_time: false
    # Nano CPU budget: model/scoring must fit in a 100 ms control cycle.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0  # Stop the action immediately if no feasible command exists.

    progress_checker_plugin: "progress_checker"
    # Foxy selects one goal checker with the singular parameter name.
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "limo_dwb_critics::AckermannMPCController"
      # DWB initializes this compatibility generator; the MPC subclass
      # replaces the search loop and does not use it to generate candidates.
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      debug_trajectory_details: false
      publish_evaluation: false  # Enable temporarily to inspect candidate costs.
      publish_global_plan: true
      publish_transformed_plan: true
      publish_local_plan: true
      publish_cost_grid_pc: false

      # Match the real LIMO limits used by the Humble MPPI profile.
      min_vel_x: 0.0  # Forward motion and stopping only.
      max_vel_x: 0.40
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.10
      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.0
      acc_lim_x: 1.3
      acc_lim_y: 0.0
      acc_lim_theta: 3.4
      decel_lim_x: -1.3
      decel_lim_y: 0.0
      decel_lim_theta: -3.4

      # Standard DWB fallback settings, used if plugin is switched back to
      # dwb_core::DWBLocalPlanner. MPC sampling is configured below.
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 61
      sim_time: 2.5
      discretize_by_time: true
      time_granularity: 0.05
      linear_granularity: 0.05
      angular_granularity: 0.025
      include_last_point: true

      # 40 * 0.10 = 4.0 s horizon. Only the first reachable command is sent;
      # the remaining sequence is shifted and reoptimized at the next cycle.
      MPC:
        StartConnector:
          # Keep physical obstacle collision checks on the initial prefix too.
          ignore_obstacles: false
          topic: /limo/planning/start_connector
          position_tolerance: 0.05
          yaw_tolerance: 0.10
        # Like the Humble smoother: continue the command ramp across cycles
        # even when noisy/lagging odometry still reports near-zero motion.
        feedback: "OPEN_LOOP"
        Debug:
          enabled: true  # MPC telemetry.
          preview_enabled: false  # The PC starts the renderer via desktop_app.launch.py.
          topic: /limo/control/mpc_debug
          publish_rate: 4.0
          samples_per_family: 27
          pose_stride: 2
        steering_feedback_min_velocity: 0.05
        model_dt: 0.10  # Must equal 1 / controller_frequency.
        time_steps: 40
        control_segments: 3
        block_fractions: [0.25, 0.50, 0.25]  # Turn/counterturn/return; total horizon remains 4 s.
        structured_actions: true
        deduplicate: true  # Score identical realized velocity/steering sequences only once.
        action_variants: 3
        action_noise: 0.20  # Fixed-seed fractional variation; no frame-to-frame redraw.
        Tube:
          enabled: true  # Full footprint inside at START and at the terminal state.
        progress_weight: 2.0
        progress_distance: 1.0  # Desired progress in meters over the horizon.
        terminal_heading_weight: 1.0
        Startup:
          enabled: true
          max_initial_speed: 0.05  # Add three slow starts only at low speed (m/s).
          target_speed: 0.03  # Ramp to this speed, then hold through the horizon.
          acceleration: 0.05  # m/s^2; steering still obeys max_steering_rate.
        batch_size: 59  # 56 regular proposals + at most three slow starts, before deduplication.
        velocity_samples: 6
        curvature_samples: 11
        wheelbase: 0.20
        rear_axle_to_base: 0.10
        max_steering_rate: 0.5  # Bicycle steering rad/s; 0.05 rad per control cycle.
        velocity_std: 0.12
        steering_std: 0.20
        acceleration_weight: 0.5
        steering_weight: 0.5
        # Immediate command costs are not averaged over the prediction horizon.
        steering_command_weight: 0.2
        steering_rate_change_weight: 0.10

      transform_tolerance: 0.20
      # Keep a free rejoin point beyond newly observed local obstacles.
      prune_distance: 2.50
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      # The custom critic is evaluated first so impossible Ackermann commands
      # are discarded before the more expensive footprint and path scoring.
      default_critic_namespaces: ["dwb_critics", "limo_dwb_critics"]
      critics:
        - "AckermannKinematics"
        - "MppiObstacle"
        # DWB sign locks can forbid the steering reversal needed to leave a
        # detour. MPC already constrains and penalizes command changes.
        - "MppiPath"

      AckermannKinematics.scale: 1.0
      AckermannKinematics.min_turning_radius: 0.462
      AckermannKinematics.lateral_tolerance: 0.000001
      AckermannKinematics.stopped_velocity: 0.001

      # Reference: origin/humble-navigation, nav_limo_controller/config/
      # mppi_control_params.yaml. Cost powers are 1 in that profile.
      # Double the reference obstacle weight relative to all path/goal costs.
      # Obstacle cost = 6 * mean(center_cost / 254), with footprint collision
      # rejection at every pose. This scale is NOT DWB's raw summed cost.
      MppiObstacle.scale: 6.0
      MppiObstacle.critical_cost: 300.0
      MppiObstacle.full_footprint_check: true  # Interior + edges, including intermediate poses.
      # Disable ordinary obstacle repulsion below 15 cm; keep critical/collision checks.
      MppiObstacle.near_goal_distance: 0.15

      # Match Humble's weights and goal-distance gates in meters/radians.
      # Collisions/kinematic violations remain hard constraints, so there is
      # no finite collision_cost or soft ConstraintCritic weight to tune.
      MppiPath:
        scale: 1.0
        ObstacleGuidance:
          enabled: true
          clearance_margin: 0.0  # Footprint critic checks the full oriented robot.
          trigger_margin: 0.05  # Start detours within 5 cm of the padded footprint; trigger only.
          cost_weight: 2.0
          heading_weight: 2.0
          rejoin_distance: 0.50
        GoalCritic:
          cost_weight: 5.0
          threshold_to_consider: 1.0
        GoalAngleCritic:
          cost_weight: 3.0
          threshold_to_consider: 0.50
        PathAlignCritic:
          cost_weight: 10.0
          threshold_to_consider: 0.50
          max_path_occupancy_ratio: 0.15
          use_path_orientations: true
        PathFollowCritic:
          cost_weight: 5.0
          threshold_to_consider: 1.0
          # Metric replacement for MPPI's batch-wide furthest + point offset.
          lookahead_distance: 1.25
        PathAngleCritic:
          cost_weight: 2.0
          threshold_to_consider: 0.50
          max_angle_to_furthest: 1.0
          forward_preference: false

# Laser observations stay lethal and receive Nav2 inflation. Semantic boardwalk
# costs (90) stay soft, including their source-grid repulsion band.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.20
      rolling_window: true
      # Include the sides of the obstacle and a free rejoin point for guidance.
      width: 5
      height: 5
      resolution: 0.02
      # Match the physical/planner footprint when checking laser collisions.
      footprint: "[[-0.161, -0.110], [-0.161, 0.110], [0.161, 0.110], [0.161, -0.110]]"
      footprint_padding: 0.0  # Effective controller footprint: 0.322 x 0.220 m.
      track_unknown_space: false
      always_send_full_costmap: false
      trinary_costmap: false
      lethal_cost_threshold: 100  # Boardwalk 90 is repulsive, never a hard collision.
      unknown_cost_value: 255
      use_maximum: true

      plugins: ["obstacle_layer", "local_ctrl_map_layer", "inflation_layer", "path_distance_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: false
          max_obstacle_height: 2.0
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00

      local_ctrl_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/limo/map_package/online/local_costmap"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        transform_tolerance: 0.05

      inflation_layer:
        # After sensor fusion: Gaussian MAX, before adding distance to the path.
        plugin: "limo_inflation::GaussianLayer"
        enabled: true
        obstacle_cost_threshold: 1  # Every positive raw cost; free/unknown are not seeds.
        sigma_x: 0.02  # Standard deviation in meters, along the costmap x axis.
        sigma_y: 0.02  # Standard deviation in meters, along the costmap y axis.
        covariance_xy: 0.0  # Off-diagonal covariance in m^2; abs(value) < sigma_x*sigma_y.
        # Independent broad field from the same original source cells; MAX, never sum.
        broad_enabled: true
        broad_sigma: 0.20  # Isotropic standard deviation in meters (variance: 0.04 m^2).
        broad_peak_cost: 100  # Same soft peak for every positive source, regardless of class.

      path_distance_layer:
        # Last: add distance to the global reference; never inflate this cost.
        plugin: "limo_inflation::PathDistanceLayer"
        enabled: true
        path_topic: /limo/planning/path
        max_cost: 70  # Additional cost, capped independently of obstacle inflation.
        distance_for_max_cost: 0.50  # Meters: linear ramp from zero on the path.
        tube_radius: 0.60  # Shared by START guard, terminal constraint and preview.
        # Nonlethal sums saturate at 252; existing 253/254/255 remain unchanged.

# Shared velocity arbitration for this runtime profile.
twist_mux:
  ros__parameters:
    use_sim_time: false
    output_topic: /cmd_vel
    publish_rate: 20.0
    topics:
      autonomy:
        topic: /cmd_vel_autonomy
        timeout: 0.5
        priority: 10
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100

# Never take chassis ownership back automatically from the phone/remote.
path_executor:
  ros__parameters:
    goal_circle_radius: 0.20  # Shared with the preview's green circle (meters).
    success_dwell_time: 2.0  # Continuous measured stop inside the circle (ROS seconds).
    stopped_linear_velocity: 0.01  # m/s; measured planar speed.
    stopped_angular_velocity: 0.05  # rad/s; measured yaw rate.
    success_odom_topic: /odometry/filtered
    success_odom_timeout: 0.5  # Maximum measurement age and gap between qualifying samples (s).
    require_tube_start: true
    require_chassis_status: true
    commanded_control_mode: 1
    chassis_status_timeout: 1.0
