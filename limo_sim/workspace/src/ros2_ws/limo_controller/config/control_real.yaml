# real controller profile; selected by robot_model.
# Nav2 Foxy sampled MPC for the AgileX LIMO in Ackermann mode.
# Uses DWB critics to score constrained, time-varying control sequences.
# Steering dynamics and odometry/model agreement need calibration on the robot.

controller_server:
  ros__parameters:
    use_sim_time: false
    # Nano CPU budget: model/scoring must fit in a 100 ms control cycle.
    controller_frequency: 10.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3

    progress_checker_plugin: "progress_checker"
    # Foxy selects one goal checker with the singular parameter name.
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "limo_dwb_critics::AckermannMPCController"
      # DWB initializes this compatibility generator; the MPC subclass
      # replaces the search loop and does not use it to generate candidates.
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      debug_trajectory_details: false
      publish_evaluation: false  # Enable temporarily to inspect candidate costs.
      publish_global_plan: true
      publish_transformed_plan: true
      publish_local_plan: true
      publish_cost_grid_pc: false

      # Match the real LIMO limits used by the Humble MPPI profile.
      min_vel_x: -0.10
      max_vel_x: 0.50
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.10
      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.0
      acc_lim_x: 1.3
      acc_lim_y: 0.0
      acc_lim_theta: 3.4
      decel_lim_x: -1.3
      decel_lim_y: 0.0
      decel_lim_theta: -3.4

      # Standard DWB fallback settings, used if plugin is switched back to
      # dwb_core::DWBLocalPlanner. MPC sampling is configured below.
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 61
      sim_time: 2.5
      discretize_by_time: true
      time_granularity: 0.05
      linear_granularity: 0.05
      angular_granularity: 0.025
      include_last_point: true

      # 25 * 0.10 = 2.5 s horizon. Only the first reachable command is sent;
      # the remaining sequence is shifted and reoptimized at the next cycle.
      MPC:
        # Like the Humble smoother: continue the command ramp across cycles
        # even when noisy/lagging odometry still reports near-zero motion.
        feedback: "OPEN_LOOP"
        steering_feedback_min_velocity: 0.05
        model_dt: 0.10  # Must equal 1 / controller_frequency.
        time_steps: 25
        control_segments: 5
        # 54 deterministic seeds + stop/warm start + 40 sampled sequences.
        batch_size: 96
        velocity_samples: 6
        curvature_samples: 9
        wheelbase: 0.20
        rear_axle_to_base: 0.10
        max_steering_rate: 0.5  # Bicycle steering rad/s; 0.05 rad per control cycle.
        velocity_std: 0.12
        steering_std: 0.10
        acceleration_weight: 0.5
        steering_weight: 0.5
        # Immediate command costs are not averaged over the prediction horizon.
        steering_command_weight: 0.2
        steering_rate_change_weight: 0.1

      transform_tolerance: 0.20
      prune_distance: 1.50
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      # The custom critic is evaluated first so impossible Ackermann commands
      # are discarded before the more expensive footprint and path scoring.
      default_critic_namespaces: ["dwb_critics", "limo_dwb_critics"]
      critics:
        - "AckermannKinematics"
        - "MppiObstacle"
        - "Oscillation"
        - "MppiPath"

      AckermannKinematics.scale: 1.0
      AckermannKinematics.min_turning_radius: 0.462
      AckermannKinematics.lateral_tolerance: 0.000001
      AckermannKinematics.stopped_velocity: 0.001

      # Reference: origin/humble-navigation, nav_limo_controller/config/
      # mppi_control_params.yaml. Cost powers are 1 in that profile.
      # Obstacle cost = 3 * mean(center_cost / 254), with footprint collision
      # rejection at every pose. This scale is NOT DWB's raw summed cost.
      MppiObstacle.scale: 3.0
      MppiObstacle.critical_cost: 300.0
      MppiObstacle.near_goal_distance: 0.50

      # Match Humble's weights and goal-distance gates in meters/radians.
      # Collisions/kinematic violations remain hard constraints, so there is
      # no finite collision_cost or soft ConstraintCritic weight to tune.
      MppiPath:
        scale: 1.0
        GoalCritic:
          cost_weight: 5.0
          threshold_to_consider: 1.0
        GoalAngleCritic:
          cost_weight: 3.0
          threshold_to_consider: 0.50
        PathAlignCritic:
          cost_weight: 10.0
          threshold_to_consider: 0.50
          max_path_occupancy_ratio: 0.15
          use_path_orientations: true
        PathFollowCritic:
          cost_weight: 5.0
          threshold_to_consider: 1.0
          # Metric replacement for MPPI's batch-wide furthest + point offset.
          lookahead_distance: 1.25
        PathAngleCritic:
          cost_weight: 2.0
          threshold_to_consider: 0.50
          max_angle_to_furthest: 1.0
          forward_preference: false
      Oscillation.scale: 1.0

# The controller costmap merges the live LaserScan and the raw semantic grid,
# marks semantic values above 85 as lethal, and then performs the only inflation.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 10.0
      publish_frequency: 2.0
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.20
      rolling_window: true
      width: 3
      height: 3
      resolution: 0.05
      footprint: "[[-0.161, -0.110], [-0.161, 0.110], [0.161, 0.110], [0.161, -0.110]]"
      footprint_padding: 0.0
      track_unknown_space: false
      always_send_full_costmap: false
      trinary_costmap: false
      lethal_cost_threshold: 86
      unknown_cost_value: 255
      use_maximum: true

      plugins: ["obstacle_layer", "local_ctrl_map_layer", "inflation_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: false
          max_obstacle_height: 2.0
          obstacle_min_range: 0.20
          obstacle_max_range: 2.50
          raytrace_min_range: 0.20
          raytrace_max_range: 3.00

      local_ctrl_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/limo/map_package/online/local_costmap"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        transform_tolerance: 0.05

      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        enabled: true
        inflation_radius: 0.30  # Same obstacle-distance field as the Humble profile.
        cost_scaling_factor: 8.0

# Shared velocity arbitration for this runtime profile.
twist_mux:
  ros__parameters:
    use_sim_time: false
    output_topic: /cmd_vel
    publish_rate: 20.0
    topics:
      autonomy:
        topic: /cmd_vel_autonomy
        timeout: 0.5
        priority: 10
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100

# Never take chassis ownership back automatically from the phone/remote.
path_executor:
  ros__parameters:
    require_chassis_status: true
    commanded_control_mode: 1
    chassis_status_timeout: 1.0
