# sim controller profile; selected by robot_model.
# Nav2 Foxy sampled MPC for the AgileX LIMO in Ackermann mode.
# Uses DWB critics to score constrained, time-varying control sequences.
# Steering dynamics and odometry/model agreement need calibration on the robot.

controller_server:
  ros__parameters:
    use_sim_time: true
    controller_frequency: 20.0
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.0
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.0  # Stop the action immediately if no feasible command exists.

    progress_checker_plugin: "progress_checker"
    # Foxy selects one goal checker with the singular parameter name.
    goal_checker_plugin: "goal_checker"
    controller_plugins: ["FollowPath"]

    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.10
      movement_time_allowance: 10.0

    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      xy_goal_tolerance: 0.10
      yaw_goal_tolerance: 0.20

    FollowPath:
      plugin: "limo_dwb_critics::AckermannMPCController"
      # DWB initializes this compatibility generator; the MPC subclass
      # replaces the search loop and does not use it to generate candidates.
      trajectory_generator_name: "dwb_plugins::StandardTrajectoryGenerator"
      debug_trajectory_details: true
      publish_evaluation: false  # Enable temporarily to inspect candidate costs.
      publish_global_plan: true
      publish_transformed_plan: true
      publish_local_plan: true
      publish_cost_grid_pc: false

      # Preserve the LIMO velocity limits; geometry below matches Gazebo.
      min_vel_x: 0.0  # Structured actions move forward or stop.
      max_vel_x: 0.50
      min_vel_y: 0.0
      max_vel_y: 0.0
      max_vel_theta: 1.10
      min_speed_xy: 0.0
      max_speed_xy: 0.50
      min_speed_theta: 0.0
      acc_lim_x: 1.3
      acc_lim_y: 0.0
      acc_lim_theta: 3.4
      decel_lim_x: -1.3
      decel_lim_y: 0.0
      decel_lim_theta: -3.4

      # Standard DWB fallback settings, used if plugin is switched back to
      # dwb_core::DWBLocalPlanner. MPC sampling is configured below.
      vx_samples: 20
      vy_samples: 1
      vtheta_samples: 61
      sim_time: 2.5
      discretize_by_time: true
      time_granularity: 0.05
      linear_granularity: 0.05
      angular_granularity: 0.025
      include_last_point: true

      # 80 * 0.05 = 4.0 s horizon, including the steering reversal of a detour.
      # Only the first reachable command is sent;
      # the remaining sequence is shifted and reoptimized at the next cycle.
      MPC:
        # Like the Humble smoother: continue the command ramp across cycles
        # even when noisy/lagging odometry still reports near-zero motion.
        feedback: "OPEN_LOOP"
        prefer_motion: true  # Outside xy_goal_tolerance, prefer a feasible positive first command over stopping.
        Timing:
          enabled: true
          topic: /limo/control/mpc_timing
          publish_rate: 1.0
          log_summary: true
          csv_directory: "~/.ros/limo_timing"
        Debug:
          enabled: true  # MPC telemetry.
          preview_enabled: true  # Start the image renderer; requires telemetry.
          topic: /limo/control/mpc_debug
          publish_rate: 10.0  # Match the preview; control still runs at 20 Hz.
          samples_per_family: 27  # Evenly spread across each family's candidates.
          pose_stride: 2  # Keep first/last poses, downsample intermediate poses.
        steering_feedback_min_velocity: 0.05
        model_dt: 0.05  # Must equal 1 / controller_frequency.
        time_steps: 80
        control_segments: 3
        block_fractions: [0.25, 0.50, 0.25]  # Turn/counterturn/return; total horizon remains 4 s.
        structured_actions: true
        deduplicate: true  # Score identical realized velocity/steering sequences only once.
        action_variants: 3
        action_noise: 0.20  # Fixed-seed fractional variation; no frame-to-frame redraw.
        Tube:
          enabled: true  # Full footprint inside at START and at the terminal state.
        progress_weight: 2.0
        progress_distance: 1.0  # Desired progress in meters over the horizon.
        terminal_heading_weight: 1.0
        Startup:
          enabled: true
          max_initial_speed: 0.05  # Add three slow starts only at low speed (m/s).
          target_speed: 0.03  # Ramp to this speed, then hold through the horizon.
          acceleration: 0.05  # m/s^2; steering still obeys max_steering_rate.
        batch_size: 59  # 56 regular proposals + at most three slow starts, before deduplication.
        velocity_samples: 8
        curvature_samples: 15
        wheelbase: 0.24
        rear_axle_to_base: 0.12
        max_steering_rate: 0.5  # Bicycle steering rad/s; 0.025 rad per control cycle.
        velocity_std: 0.12
        steering_std: 0.10
        acceleration_weight: 0.5
        steering_weight: 0.5
        # Immediate command costs are not averaged over the prediction horizon.
        steering_command_weight: 0.2
        steering_rate_change_weight: 0.3  # Penalize rapid reversals of the steering correction.
        # Legacy penalties; structured mode only commands forward motion or stopping.
        reverse_distance_weight: 2.0  # Cost per metre travelled in reverse.
        direction_change_weight: 0.5  # Cost per forward/reverse transition.

      transform_tolerance: 0.20
      # Keep a free rejoin point beyond metre-wide online obstacles.
      prune_distance: 2.50
      xy_goal_tolerance: 0.10
      trans_stopped_velocity: 0.05
      short_circuit_trajectory_evaluation: true
      stateful: true

      # The custom critic is evaluated first so impossible Ackermann commands
      # are discarded before the more expensive footprint and path scoring.
      default_critic_namespaces: ["dwb_critics", "limo_dwb_critics"]
      critics:
        - "AckermannKinematics"
        - "MppiObstacle"
        # DWB sign locks can forbid the steering reversal needed to leave a
        # detour. MPC already constrains and penalizes command changes.
        - "MppiPath"

      AckermannKinematics.scale: 1.0
      AckermannKinematics.min_turning_radius: 0.55
      AckermannKinematics.lateral_tolerance: 0.000001
      AckermannKinematics.stopped_velocity: 0.001

      # Reference: origin/humble-navigation, nav_limo_controller/config/
      # mppi_control_params.yaml. Cost powers are 1 in that profile.
      # Obstacle cost = 6 * mean(center_cost / 254), with footprint collision
      # rejection at every pose. This scale is NOT DWB's raw summed cost.
      MppiObstacle.scale: 6.0
      MppiObstacle.critical_cost: 300.0
      MppiObstacle.full_footprint_check: true  # Interior + edges, including intermediate poses.
      # Disable ordinary obstacle repulsion below 15 cm; keep critical/collision checks.
      MppiObstacle.near_goal_distance: 0.15

      # Match Humble's weights and goal-distance gates in meters/radians.
      # Collisions/kinematic violations remain hard constraints, so there is
      # no finite collision_cost or soft ConstraintCritic weight to tune.
      MppiPath:
        scale: 1.0
        ObstacleGuidance:
          enabled: true
          trigger_layer: "obstacle_layer"  # Only /scan markings initiate obstacle detours.
          use_smac: true  # false: original Dijkstra; restart controller after switching.
          Smac:
            async_planning: true  # Search in background; control never waits for the result.
            replan_frequency: 4.0  # Maximum search Hz (0.25 s between starts); safe cached routes do not trigger periodic searches.
            replan_goal_distance: 0.25  # m from the last accepted target; robot connection is checked every cycle.
            replan_goal_angle: 0.35  # rad (~20 deg), wrapped yaw difference from the last accepted target.
            failure_advance_distance: 0.25  # m along the original reference before the next free retry target after a failed search.
            max_iterations: 50000  # Foxy bounds search iterations, not wall time.
            angle_quantization_bins: 64
            tolerance: 0.05
          clearance_margin: 0.0  # Footprint critic checks the full oriented robot.
          trigger_margin: 0.05  # Euclidean margin around the padded footprint; trigger only.
          trigger_front_extension: 0.0  # Optional additional front extension; trigger only.
          lookahead_distance: 1.0  # Laser avoidance only; normal path tracking has its own lookahead.
          cost_weight: 2.0
          heading_weight: 2.0
          rejoin_distance: 0.50  # Advance along the free reference after the lookahead target.
        GoalCritic:
          cost_weight: 5.0
          threshold_to_consider: 1.0
        GoalAngleCritic:
          cost_weight: 3.0
          threshold_to_consider: 0.50
        PathAlignCritic:
          cost_weight: 10.0
          threshold_to_consider: 0.50
          max_path_occupancy_ratio: 0.15
          use_path_orientations: true
        PathFollowCritic:
          cost_weight: 5.0
          threshold_to_consider: 1.0
          # Metric replacement for MPPI's batch-wide furthest + point offset.
          lookahead_distance: 1.25
        PathAngleCritic:
          cost_weight: 2.0
          threshold_to_consider: 0.50
          max_angle_to_furthest: 1.0
          forward_preference: true

# The controller costmap merges the live LaserScan and the raw semantic grid,
# marks semantic values above 85 as lethal, and then performs the only inflation.
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: true
      update_frequency: 15.0
      publish_frequency: 10.0  # Viewer output only; internal updates remain at 15 Hz.
      global_frame: odom
      robot_base_frame: base_link
      transform_tolerance: 0.20
      rolling_window: true
      # Include both sides and the exit of the 1 m cubes in local scoring.
      width: 5
      height: 5
      resolution: 0.02
      footprint: "[[-0.161, -0.110], [-0.161, 0.110], [0.161, 0.110], [0.161, -0.110]]"
      footprint_padding: 0.01  # Add 2 cm per side to the controller collision footprint.
      track_unknown_space: false
      always_send_full_costmap: false
      trinary_costmap: false
      lethal_cost_threshold: 86
      unknown_cost_value: 255
      use_maximum: true

      plugins: ["obstacle_layer", "local_ctrl_map_layer", "inflation_layer", "path_distance_layer"]

      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        combination_method: 1
        observation_sources: scan
        scan:
          topic: /scan
          data_type: "LaserScan"
          clearing: true
          marking: true
          inf_is_valid: false
          # The simulated laser is 1 cm below the odom/base_link plane.
          min_obstacle_height: -0.05
          max_obstacle_height: 2.0
          # Foxy names; LaserScan.range_min supplies the sensor's near limit.
          obstacle_range: 2.50
          raytrace_range: 3.00

      local_ctrl_map_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_topic: "/limo/map_package/online/local_costmap"
        map_subscribe_transient_local: true
        subscribe_to_updates: false
        transform_tolerance: 0.05

      inflation_layer:
        # After sensor fusion: Gaussian MAX, before adding distance to the path.
        plugin: "limo_inflation::GaussianLayer"
        enabled: true
        obstacle_cost_threshold: 1  # Every positive raw cost; free/unknown are not seeds.
        sigma_x: 0.02  # Standard deviation in meters, along the costmap x axis.
        sigma_y: 0.02  # Standard deviation in meters, along the costmap y axis.
        covariance_xy: 0.0  # Off-diagonal covariance in m^2; abs(value) < sigma_x*sigma_y.
        # Independent broad field from the same original source cells; MAX, never sum.
        broad_enabled: true
        broad_sigma: 0.20  # Isotropic standard deviation in meters (variance: 0.04 m^2).
        broad_peak_cost: 100  # Same soft peak for every positive source, regardless of class.

      path_distance_layer:
        # Last: add distance to the global reference; never inflate this cost.
        plugin: "limo_inflation::PathDistanceLayer"
        enabled: true
        path_topic: /limo/planning/path
        max_cost: 70  # Additional cost, capped independently of obstacle inflation.
        distance_for_max_cost: 0.50  # Meters: linear ramp from zero on the path.
        tube_radius: 0.80  # Shared by START guard, terminal constraint and preview.
        # Nonlethal sums saturate at 252; existing 253/254/255 remain unchanged.

# Simulation has no physical chassis feedback.
path_executor:
  ros__parameters:
    goal_circle_radius: 0.20  # Shared with the preview's green circle (meters).
    success_dwell_time: 2.0  # Continuous measured stop inside the circle (ROS seconds).
    stopped_linear_velocity: 0.01  # m/s; measured planar speed.
    stopped_angular_velocity: 0.05  # rad/s; measured yaw rate.
    success_odom_topic: /odometry/filtered
    success_odom_timeout: 0.5  # Maximum measurement age and gap between qualifying samples (s).
    require_tube_start: true
    require_chassis_status: false

# Shared velocity arbitration for this runtime profile.
twist_mux:
  ros__parameters:
    use_sim_time: true
    output_topic: /cmd_vel
    publish_rate: 50.0
    topics:
      autonomy:
        topic: /cmd_vel_autonomy
        timeout: 0.5
        priority: 10
      teleop:
        topic: /cmd_vel_teleop
        timeout: 0.5
        priority: 100
