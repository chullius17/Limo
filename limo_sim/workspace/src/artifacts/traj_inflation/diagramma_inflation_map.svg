   </g>
   <g id="text_15">
    <text style="fill:#52657a;font-family:DejaVu Sans;font-size:10.7px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 399.744, 362.997273)" x="399.744" y="362.997273">OpenCV: DIST_L2 + DIST_MASK_PRECISE</text>
