   <g id="text_6">
    <text style="fill:#1769aa;font-family:DejaVu Sans;font-size:15px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 347.904, 123.960469)" x="347.904" y="123.960469">StaticLayer  ·  costo della mappa di base</text>
   </g>
   <g id="text_7">
    <text style="fill:#172c43;font-family:DejaVu Sans;font-size:13.5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 347.904, 149.525156)" x="347.904" y="149.525156">Sorgente ≥ 60  →  ostacolo letale (254)</text>
   </g>
   <g id="text_8">
    <text style="fill:#52657a;font-family:DejaVu Sans;font-size:11.5px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 347.904, 172.301281)" x="347.904" y="172.301281">I valori intermedi mantengono un costo semantico</text>
   </g>
   <g id="text_9">
    <text style="fill:#1769aa;font-family:DejaVu Sans;font-size:15px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 347.904, 242.544469)" x="347.904" y="242.544469">BorderFollowLayer  ·  costo geometrico</text>
   </g>
   <g id="text_10">
    <text style="fill:#1769aa;font-family:DejaVu Sans;font-size:14px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 367.488, 274.079125)" x="367.488" y="274.079125">1</text>
   </g>
   <g id="text_11">
    <text style="fill:#172c43;font-family:DejaVu Sans;font-size:12.7px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 399.744, 271.128406)" x="399.744" y="271.128406">Maschera binaria</text>
   </g>
   <g id="text_12">
    <text style="fill:#52657a;font-family:DejaVu Sans;font-size:10.7px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 399.744, 291.312531)" x="399.744" y="291.312531">Sorgente ≥ 10 → 0; altre celle → 255</text>
