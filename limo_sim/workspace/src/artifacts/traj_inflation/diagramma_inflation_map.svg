   <g id="text_27">
    <text style="fill:#172c43;font-family:DejaVu Sans;font-size:12.5px;font-style:normal;font-weight:bold;text-anchor:start;" transform="rotate(-0, 65.664, 547.072391)" x="65.664" y="547.072391">Le sorgenti ≥ 10 includono anche le linee bianche (30).</text>
