   </g>
   <g id="text_18">
    <text style="fill:#52657a;font-family:DejaVu Sans;font-size:10.7px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 399.744, 435.168531)" x="399.744" y="435.168531">d = distanza in pixel × risoluzione della mappa</text>
