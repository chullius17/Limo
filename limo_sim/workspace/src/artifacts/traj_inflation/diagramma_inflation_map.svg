   <g id="text_2">
    <text style="fill:#52657a;font-family:DejaVu Sans;font-size:15px;font-style:normal;font-weight:normal;text-anchor:start;" transform="rotate(-0, 51.84, 79.955063)" x="51.84" y="79.955063">Stessa mappa sorgente; StaticLayer precede BorderFollowLayer</text>
