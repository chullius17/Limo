# ROS 2 parameter file for limo_map_node / map.launch.py.
# Active entries select the existing offline simulation class/evidence profile.
# Commented entries show the actual C++ defaults; uncomment them to customize.
# Topics without a leading slash are relative to the node namespace. Absolute
# names start with '/'. All mapper settings are read at startup; restart to apply.
limo_map:
  ros__parameters:
    # Classified surface endpoints from limo_cloud or any compatible producer.
    # PointCloud2 requires x/y/z FLOAT32 and class_id UINT8, each count=1; field
    # offsets, padding and endianness are respected. Nonfinite XYZ are ignored.
    # Clouds need a nonempty frame_id and positive sensor timestamp. Duplicate or
    # out-of-order timestamps are ignored: call reset_map before bag rewind.
    # cloud_topic: /limo/cv_package/visual_ptcld/points

    # Complete laser OccupancyGrid in map_frame, values -1..100. Each accepted
    # message replaces the previous laser grid, including free and unknown cells.
    # Its geometry (resolution, dimensions and rotated origin) defines all outputs.
    # CV is accumulated beforehand, but publishing and saving wait for this grid.
    # reference_map_topic: /map

    # Destination TF frame for cloud endpoints and required reference-map frame.
    # Transforms must be planar and upright. No TF is published by this node.
    # map_frame: map

    # Continuous fixed frame used only in Cartographer mode to resolve cloud and
    # submap poses at their respective timestamps through lookupTransform full.
    # odom_frame: odom

    # Prefix for published grids, status and services. Default endpoints preserve
    # the offline GUI contract. Outputs are reliable/transient-local:
    #   <prefix>/map/semantic_grid       CV costs before laser fusion
    #   <prefix>/map/combined_grid       laser 100 > known CV > laser state
    #   <prefix>/map/class_<ID>_map      winning group cost, 0 in other known
    #                                  groups, -1 in unknown/uncertain cells
    #   <prefix>/map_saver/status       String status messages
    #   <prefix>/map_saver/save_map     Trigger save service
    #   <prefix>/reset_map              Trigger: reset CV and timestamps only
    # Update GUI save_service/status_topic if you change this prefix. Aliases
    # sharing evidence also publish identical per-class layers.
    # output_prefix: /limo/map_package/offline

    # Parallel arrays: unique input IDs in [0,255], each with an integer cost in
    # [0,100]. Cost is semantic traversability, not occupancy probability. Cost 0
    # is observed free space; -1 is reserved for unknown output, never a class cost.
    # IDs absent from class_ids supply no evidence. ID 0 can be included explicitly.
    # These active values equal the C++ defaults and describe the current pipeline:
    # road, yellow lines, soft obstacle, boardwalk, inner road, inner boardwalk.
    class_ids: [1, 2, 3, 4, 5, 6]
    class_costs: [0, 60, 30, 90, 0, 90]

    # Optional parallel list of arbitrary integer group IDs. Equal group IDs share
    # one evidence score and MUST have equal costs. Empty [] is the C++ default:
    # each input class is independent, even if two classes have equal costs.
    # This profile joins road 1/5 and boardwalk 4/6 like the offline mapper.
    # Change or clear this list when configuring a different input class set.
    evidence_groups: [1, 2, 3, 4, 1, 4]

    # Sparse evidence-cell size in metres: finite and >0. Tiles contain 32x32
    # cells in each local submap. Output resolution always comes from the laser
    # grid; changing this parameter changes evidence discretization, not SLAM.
    # resolution: 0.05

    # Finite positive evidence increments. One update per cell/cloud is split
    # across observed groups: delta = hit*fraction - miss*(1-fraction). Density
    # cannot multiply confidence. No ray clearing, FOV misses or time decay occurs.
    # C++ defaults are hit=0.85, miss=0.4; simulation uses the active values below.
    hit_log_odds: 0.625
    miss_log_odds: 0.625

    # Finite positive absolute saturation bound for each group's score. Lower
    # limits allow contradictory observations to change old classifications sooner.
    # log_odds_limit: 3.0

    # Finite positive winning-score threshold, <= log_odds_limit. A unique winner
    # at or above it selects the exact configured class cost; ties remain unknown.
    # min_evidence: 0.5

    # Integer [1,255]. Before reducing evidence in an existing nonzero-cost cell,
    # require N consecutive cost-0-majority observations of that cell. Other
    # observations reset the streak; unobserved cells do not advance/reset it.
    # 1 disables this delay. New free/obstacle evidence is integrated immediately.
    # free_confirmations: 1

    # Finite positive maximum publication frequency in Hz. Only dirty maps are
    # rendered; the timer uses wall time and stamps outputs with the ROS clock.
    # publish_rate_hz: 4.0

    # Finite positive steady-time TF retry deadline, seconds. The latest pending
    # cloud replaces older unprocessed input. TF is requested at the cloud sensor
    # timestamp; expiration drops the cloud without falling back to latest TF.
    # tf_wait_sec: 0.5

    # Positive integer: maximum width*height before accepting an input cloud.
    # max_input_points: 100000

    # Integer >=1024: total allocated cells across all submaps in 32x32 tiles.
    # Evidence costs about 4*group_count+9 bytes/cell plus container overhead.
    # Rejection at this limit leaves existing evidence intact. Dense output and
    # outgoing ROS messages need additional memory proportional to map/class size.
    # max_cells: 2000000

    # Positive integer: maximum width*height for reference maps and dense renders.
    # CV outside the latest reference-map extent remains stored for later growth.
    # max_output_cells: 4000000

    # Nonempty output directory; relative paths use the process working directory.
    # Set an absolute path for a fixed destination. Trigger saves three PGM/YAML
    # pairs: <name>_complete, <name>_laser and <name>_cv_obstacle, replacing files.
    # Raw complete/laser maps preserve exact 0..100 costs and unknown (-1 ->255).
    # All files are staged first; each replacement is atomic, not the six-file set.
    # save_directory: ros2_maps/semantic

    # Filename stem, without path or .pgm/.yaml suffix. Allowed characters are
    # letters, digits, '.', '_' and '-'; empty, '.' and '..' are rejected on save.
    # save_map_name: limo_map

    # Odd integer [1,255]; 1 disables the save-time semantic median. Only the saved
    # CV snapshot is filtered: live evidence and laser remain unchanged. Unknown
    # neighbors participate as -1, but originally unknown cells are never filled.
    # Laser fusion occurs after filtering. Kernel size is measured in output cells.
    # save_median_kernel: 1

    # Binary _cv_obstacle export thresholds: integer free_max in [0,99] and
    # occupied_max in [free_max+1,100]. Costs [0,free_max] become free; costs
    # (free_max,occupied_max] become occupied; higher costs remain unknown.
    # Set occupied_max=100 to include all high-cost classes. Unobserved CV becomes
    # free only where laser is exactly 0. These thresholds do not affect live maps.
    # obstacle_free_max_cost: 39
    # obstacle_occupied_max_cost: 95

    # tf: accumulate in map_frame; revisits correct classes, but historical CV
    # geometry does not move retroactively after SLAM loop closure.
    # cartographer: store local evidence and move it with updated submap poses.
    # Requires cartographer_ros_msgs installed at build time plus an external
    # Cartographer backend, occupancy-grid publisher, TF and submap list.
    # pose_source: tf

    # Cartographer SubmapList topic in map_frame; ignored in tf mode. Newest
    # observations win overlap, then highest evidence. Omitted submaps are hidden.
    # Foxy's SubmapEntry lacks is_frozen: the latest submap of the selected
    # trajectory is used. Releases exposing that flag exclude frozen candidates.
    # submap_topic: /submap_list

    # Nonnegative int32 trajectory ID, used only in cartographer mode. Select the
    # active mapping trajectory, especially on Foxy without the frozen-state flag.
    # trajectory_id: 0

    # Finite positive maximum absolute submap/cloud timestamp difference, seconds.
    # Used only in cartographer mode; stale submap lists defer/drop pending clouds.
    # submap_max_age_sec: 2.0

    # Standard ROS clock selection. Use true with simulation /clock; cloud and TF
    # timestamps must use the same clock. map.launch.py supplies its use_sim_time
    # argument, which overrides this file and follows profile (sim=true, real=false).
    # use_sim_time: false
