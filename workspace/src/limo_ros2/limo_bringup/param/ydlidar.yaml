ydlidar_ros2_driver_node:
  ros__parameters:
    port: /dev/ydlidar
    frame_id: laser_frame
    ignore_array: ""
    baudrate: 115200
    lidar_type: 1
    device_type: 0
    sample_rate: 3
    abnormal_check_count: 4
    # Original AgileX code (disabled):
    # resolution_fixed: true
    # LIMO replacement: fixed_resolution is the parameter name declared by the
    # bundled YDLidar driver; resolution_fixed did not configure that option.
    # Keep scan geometry constant for SLAM Toolbox / Karto.
    fixed_resolution: true
    reversion: true
    inverted: true
    auto_reconnect: true
    isSingleChannel: true
    intensity: false
    support_motor_dtr: false
    angle_max: 180.0
    angle_min: -180.0
    range_max: 12.0
    range_min: 0.01
    frequency: 8.0
    # Original AgileX code (disabled):
    # invalid_range_is_inf: false
    # LIMO replacement: publish missing returns as infinity so SLAM can exclude
    # them from matching instead of treating them as zero-range obstacles.
    invalid_range_is_inf: true
